# lzssh CI: Windows tests, Windows x64 build (cross-compiled with cargo-xwin), releases on tags.
# Release: push a tag like `v0.1.0` (should match Cargo.toml's version).

# Images are pinned by digest; bump deliberately.
stages: [test, build, upload, release]

variables:
  TARGET: x86_64-pc-windows-msvc
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lzssh"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[A-Za-z0-9.]+)?$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Unit tests need real Windows (DPAPI, named pipes, icacls).
test:windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  cache:
    key: cargo-windows-$CI_COMMIT_REF_SLUG  # per ref: tag builds never reuse another ref's cache
    paths: [target/]
  script:
    # Accepted risk: official rustup installer over HTTPS, not hash-pinned.
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - cargo --version
    - cargo test --locked

build:windows:
  stage: build
  image: messense/cargo-xwin@sha256:9856b895265d4966f212228ba64802cf89337e2a2a537aa2533c1b8784cbc81b
  cache:
    key: cargo-xwin-$CI_COMMIT_REF_SLUG  # per ref: tag builds never reuse another ref's cache
    paths: [target/, .xwin-cache/]
  variables:
    XWIN_CACHE_DIR: "${CI_PROJECT_DIR}/.xwin-cache"
  script:
    - rustup target add "$TARGET"
    - cargo xwin build --locked --release --target "$TARGET" --bins
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - ZIP="lzssh-${VERSION}-windows-x64.zip"
    - mkdir -p dist/lzssh
    - cp "target/$TARGET/release/lzssh.exe" "target/$TARGET/release/lzssh-ssh.exe" dist/lzssh/
    - (command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq zip >/dev/null))
    - (cd dist && zip -r "../$ZIP" lzssh)
    - echo "ZIP=$ZIP" >> build.env
  artifacts:
    name: "lzssh-windows-x64"
    paths: ["lzssh-*-windows-x64.zip"]
    reports:
      dotenv: build.env
    expire_in: 30 days

# Upload in its own small job so the third-party toolchain image never handles release credentials.
upload:
  stage: upload
  image: curlimages/curl@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  needs: [build:windows, test:windows]
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$ZIP" "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${ZIP}"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli@sha256:00884510ffcbb6b03c0abc5dd058d7728a646cab2a419de4a7108d073ce90a03
  needs: [build:windows, upload]
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - echo "Releasing $CI_COMMIT_TAG with $ZIP"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "lzssh $CI_COMMIT_TAG"
    description: "Windows x64 build. Unzip and run `lzssh.exe`; keep `lzssh-ssh.exe` in the same folder."
    assets:
      links:
        - name: "$ZIP"
          url: "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${ZIP}"
          link_type: package
